name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build-linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Configure
              run: cmake -B build -DCMAKE_C_COMPILER=gcc

            - name: Build
              run: cmake --build build --config Release

            - name: Test
              run: ctest --test-dir build --output-on-failure -C Release

    build-linux-clang:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Configure
              run: cmake -B build -DCMAKE_C_COMPILER=clang

            - name: Build
              run: cmake --build build --config Release

            - name: Test
              run: ctest --test-dir build --output-on-failure -C Release

    build-macos:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4

            - name: Configure
              run: cmake -B build

            - name: Build
              run: cmake --build build --config Release

            - name: Test
              run: ctest --test-dir build --output-on-failure -C Release

    build-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - name: Configure
              run: cmake -B build

            - name: Build
              run: cmake --build build --config Release

            - name: Test
              run: ctest --test-dir build --output-on-failure -C Release

    build-windows-gcc:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - name: Configure
              run: cmake -B build -G "MinGW Makefiles" -DCMAKE_C_COMPILER=gcc

            - name: Build
              run: cmake --build build

            - name: Test
              run: ctest --test-dir build --output-on-failure
